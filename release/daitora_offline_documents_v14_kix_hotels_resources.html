async function buildPacket(days,opts={}){let stage=opts.stage||'plan',files=[],cache=new Map(),count=days.reduce((n,d)=>n+new Set(d.tasks.map(t=>t.orderId)).size+2,0),done=0,multiPage=[];for(let d of days){if(!d.tasks.length)throw Error(d.driver+'没有订单，未导出。');if(opts.strict){if(d.sample)throw Error('示例不能作为正式业务文书。请导入真实派单。');let issues=[...dayIssues(d,stage),...d.tasks.flatMap(t=>acceptanceIssues(t.orderId,stage))];if(stage==='actual'){let c=calcDay(d);issues.push(...c.issues);if(!c.complete)issues.push('实际时间/里程未填齐');}if(issues.length)throw Error(d.driver+' 仍缺少：'+[...new Set(issues)].join('、'));}
 let dir=days.length>1?safeName(d.driver+'_'+d.tail)+'/':'';let seen=new Set();for(let t of d.tasks){if(seen.has(t.orderId))continue;seen.add(t.orderId);let data=cache.get(t.orderId);if(!data){let doc=createDocument('acceptance',d,stage,t.orderId);data=pdfBytes(doc.canvases);cache.set(t.orderId,data);}files.push({name:dir+'運送引受書/'+fileTitle(d,t),data});opts.progress?.(++done,count,d.driver+' / 引受书');await new Promise(r=>setTimeout(r,0));}
 for(let type of ['dispatch','daily']){let doc=createDocument(type,d,stage);if(doc.canvases.length>1){multiPage.push(d.driver+' '+(type==='dispatch'?'指示书':'日报')+' '+doc.canvases.length+'页');if(!opts.allowContinuation)throw Error(d.driver+' 的'+(type==='dispatch'?'运行指示书':'日报')+'需要'+doc.canvases.length+'页。为保留字段与可读字号，本次没有截断或偷偷缩小。请整理文字，或在导出面板勾选“超过一页时允许续页”。');}files.push({name:dir+(type==='dispatch'?'運行指示書':'乗務記録表兼日常点検表')+'_'+safeName(d.date+'_'+d.driver+'_'+d.tail)+'.pdf',data:pdfBytes(doc.canvases)});opts.progress?.(++done,count,d.driver+' / '+(type==='dispatch'?'指示书':'日报'));await new Promise(r=>setTimeout(r,0));}}
 return {data:zipBytes(files),files,multiPage};}

function renderPlan(d){return `<div class="notice">下方顺序就是当天日报的地点顺序。城市/机场占位不会随机替换成酒店；请补真实地点。计划时间只进入指示书，引受书；日报予定版的实际时间与里程栏保持空白。</div><div class="row between wrap" style="margin-bottom:12px"><h3 style="margin:0;font-size:16px">全天 ${d.nodes.length} 个地点节点</h3>${btn('增加中途节点','add-node','soft','','plus')}</div><div class="tblwrap"><table class="tbl" style="min-width:1000px"><colgroup><col style="width:36px"><col style="width:80px"><col style="width:250px"><col style="width:143px"><col style="width:143px"><col style="width:90px"><col style="width:90px"><col style="width:140px"></colgroup><thead><tr><th>#</th><th>节点</th><th>计划地点（可自由编辑）</th><th>计划到达</th><th>计划离开</th><th>驶入区间</th><th>道路</th><th>顺序 / 删除</th></tr></thead><tbody>${d.nodes.map((n,i)=>`<tr><td>${i}</td><td>${esc(ROLE[n.role])}<small class="block muted">${n.taskId?'第'+(d.tasks.findIndex(t=>t.id===n.taskId)+1)+'单':''}</small></td><td>${field('node',n.id,'place','',n.place,{bare:true})}</td><td>${i?nodeTime(n,'planArr'):''}</td><td>${i<d.nodes.length-1?nodeTime(n,'planDep'):''}</td><td>${field('node',n.id,'load','',n.load,{select:{'':'待确认',empty:'空車',loaded:'実車'},bare:true})}</td><td>${field('node',n.id,'road','',n.road,{select:{'':'待确认',general:'一般道',highway:'高速'},bare:true})}</td><td>${i>0&&i<d.nodes.length-1?`${btn('↑','node-up','small','data-id="'+n.id+'"')}${btn('↓','node-down','small','data-id="'+n.id+'"')}${n.role==='via'||n.role==='rest'||n.role==='wait'?btn('删','delete-node','small danger','data-id="'+n.id+'"'):''}`:''}</td></tr>`).join('')}</tbody></table></div><div class="card pad" style="margin-top:16px"><h3>全天安全指示</h3><div class="formgrid" style="margin-top:13px">${df(d,'safeWait','待機場所',{textarea:true})}${df(d,'safeAttention','注意箇所',{textarea:true})}${df(d,'safeOther','その他指示事項',{textarea:true})}${df(d,'notes','其他传达 / 原文未识别备注',{textarea:true,full:true})}</div>${checkbox('day',d.id,'planReviewed','已核对出库、每单乘降点、顺序、空实车和运行计划。',d.planReviewed)}${checkbox('day',d.id,'languageReviewed','正式文书必要的日文 / 日文并记已核对（原文中文指示可在本单备注编辑）。',d.languageReviewed)}<div class="row wrap">${btn('保存计划版本','snapshot-plan','primary','','save')}${btn('预览全天指示书','preview-dispatch','','','eye')}</div></div>`;}
function statsHTML(d){let c=calcDay(d);return `<div class="metricgrid"><div class="metric"><small>已填相邻区间 km</small><strong>${fmt(c.total)}</strong><span>${c.complete?'区间填写完整':'部分数据，非最终总里程'}</span></div><div class="metric"><small>实车 / 空车 km</small><strong>${fmt(c.loaded)} / ${fmt(c.empty)}</strong><span>按已填且已分类区间汇总</span></div><div class="metric"><small>站间经过时间</small><strong>${fmt(c.drive)} <small>分</small></strong><span>包含信号等待与拥堵</span></div><div class="metric"><small>站点停留时间</small><strong>${fmt(c.dwell)} <small>分</small></strong><span>不自动认定为休息</span></div></div>`;}
function renderActual(d){let c=calcDay(d);return `<div id="metrics">${statsHTML(d)}</div><div class="notice">收车后在这里补录一次。填写完整里程表读数，不是本段距离。实际地点与计划不同，只改“实际地点”，原计划保留；补记版三份文书共用同一组实绩。</div><div class="row between wrap" style="margin-bottom:11px"><span class="small muted">不需要司机账号、手机同步或收单确认。</span><div>${d.sample?btn('填入演示实绩','demo-actual','small'):''} ${btn('保存实绩补记版本','snapshot-actual','primary','','save')}</div></div><div class="tblwrap"><table class="tbl" style="min-width:1110px"><colgroup><col style="width:35px"><col style="width:220px"><col style="width:140px"><col style="width:140px"><col style="width:105px"><col style="width:82px"><col style="width:82px"><col style="width:82px"><col style="width:154px"></colgroup><thead><tr><th>#</th><th>计划地点 / 实际地点</th><th>实际到达</th><th>实际离开</th><th>完整里程表 km</th><th>本段 km</th><th>行驶 分</th><th>停留 分</th><th>变更原因</th></tr></thead><tbody>${d.nodes.map((n,i)=>`<tr id="actualrow_${n.id}"><td>${i}</td><td><small class="muted">${esc(ROLE[n.role])} · ${esc(n.place)}</small>${field('node',n.id,'actualPlace','',n.actualPlace,{bare:true,placeholder:'与计划不同才填写'})}</td><td>${i?nodeTime(n,'arr'):''}</td><td>${i<d.nodes.length-1?nodeTime(n,'dep'):''}</td><td>${field('node',n.id,'odo','',n.odo,{type:'number',step:'0.1',bare:true})}</td><td class="calcv" data-calc="km" data-nid="${n.id}">${c.rows[i].km==null?'—':fmt(c.rows[i].km)}</td><td class="calcv" data-calc="drive" data-nid="${n.id}">${c.rows[i].drive??'—'}</td><td class="calcv" data-calc="dwell" data-nid="${n.id}">${c.rows[i].dwell??'—'}</td><td>${field('node',n.id,'reason','',n.reason,{bare:true})}</td></tr>`).join('')}</tbody></table></div><div id="calcWarnings">${c.issues.length?'<div class="notice error">'+c.issues.map(esc).join('<br>')+'</div>':''}</div><details class="card pad" style="margin-top:15px"><summary><b>日常点检、睡眠、休息、人数与点呼记录（按实际填写）</b></summary><div class="formgrid" style="margin-top:16px">${df(d,'weather','天候')}${df(d,'passengers','本日乘客人数（核对去重）',{type:'number'})}${df(d,'children','其中儿童',{type:'number'})}${df(d,'sleepStart','就寝时间',{type:'time'})}${df(d,'sleepEnd','起床时间',{type:'time'})}${df(d,'restMinutes','出勤前休息间隔（分钟）',{type:'number'})}${df(d,'dutyStart','出勤时间',{type:'time'})}${df(d,'dutyEnd','退勤时间',{type:'time'})}${df(d,'dutyEndDay','退勤日期',{select:{0:'当日',1:'翌日'}})}${df(d,'standbyMinutes','待机时间（实际认定，分钟）',{type:'number'})}${df(d,'breakMinutes','休憩时间（实际认定，分钟）',{type:'number'})}${df(d,'lodging','宿泊先')}</div><div class="subhead">日常点検（不会自动打○）</div><div class="formgrid">${CHECKS.map((s,i)=>field('check',d.id,String(i),s,d.checks[i],{select:{'':'未填写','○':'○ 良好','×':'× 不良'}})).join('')}</div><div class="formgrid" style="margin-top:15px">${df(d,'inspectionPerson','点检/判定记录者')}${df(d,'inspectionTime','点检时刻',{type:'time'})}${df(d,'inspectionVerdict','運行判定',{select:{'':'未判定','可':'可','否':'否'}})}${df(d,'inspectionNotes','不良箇所 / 特記事項',{textarea:true,full:true})}${df(d,'beforeCall','出库点呼时间',{type:'time'})}${df(d,'beforePerson','出库点呼执行者')}${df(d,'afterCall','入库点呼时间',{type:'time'})}${df(d,'afterPerson','入库点呼执行者')}</div><p class="form-note">这里只登记已经实施的点呼/检查；姓名与时间不代替签章或本人认证。</p></details>${checkbox('day',d.id,'actualReviewed','已核对实际地点、时间、里程与变更。原计划版本保留，实绩另存补记版本。',d.actualReviewed)}<div class="row wrap">${btn('保存实绩补记版本','snapshot-actual','primary','','save')}${btn('预览实绩日报','preview-actual','','','eye')}</div>`;}
function updateActual(){let d=current();if(!d||UI.tab!=='actual')return;let c=calcDay(d),m=$('#metrics');if(m)m.innerHTML=statsHTML(d);c.rows.forEach((r,i)=>{for(let k of ['km','drive','dwell']){let e=$(`[data-calc="${k}"][data-nid="${d.nodes[i].id}"]`);if(e)e.textContent=r[k]==null?'—':fmt(r[k]);}let tr=$('#actualrow_'+d.nodes[i].id);if(tr)tr.classList.toggle('bad',r.issues.length>0);});$('#calcWarnings').innerHTML=c.issues.length?'<div class="notice error">'+c.issues.map(esc).join('<br>')+'</div>':'';}
function renderExport(d){let orderOpts=Object.fromEntries(d.tasks.map((t,i)=>[t.orderId,pad(i+1)+' '+(t.rawTime||'待定')+' '+getOrder(t).number]));if(!orderOpts[UI.orderId])UI.orderId=d.tasks[0]?.orderId||'';return `<div class="previewgrid"><div class="card export-panel"><h3>这位司机的文件包</h3><div class="field"><label>输出数据版本</label><select id="stageSelect">${opts({plan:'予定版 / 日报实际栏空白',actual:'実績補記版 / 原计划不覆盖'},UI.stage)}</select></div><div class="field" style="margin-top:10px"><label>引受书订单</label><select id="orderSelect">${opts(orderOpts,UI.orderId)}</select></div><label class="check"><input id="strictExport" type="checkbox" ${UI.strict?'checked':''}><span>正式文书导出：阻止缺项、示例和未核价记录（不代表合规认证）。</span></label><label class="check"><input id="allowPages" type="checkbox" ${UI.allowContinuation?'checked':''}><span>超过一页时允许续页。默认不删字段、不缩成极小字。</span></label>${btn('导出该司机 ZIP','export-one','primary','','download')}${btn('导出当日全员 ZIP','export-all','','','download')}${btn('仅下载当前 PDF','pdf-one','','','doc')}<div class="tree">${esc(d.driver)}_${esc(d.tail)}/\n├─ 運送引受書/\n│  ├─ 订单01.pdf\n│  └─ 每单独立PDF…\n├─ 運行指示書.pdf\n└─ 乗務記録表兼日常点検表.pdf\n\n本司机：${new Set(d.tasks.map(t=>t.orderId)).size}＋2 份文件</div><p class="footnote">共享多车订单的引受书在相关司机文件夹中复制同一版本，不再重复创建客户订单。司机ZIP不包含客户库或全库备份。</p></div><div class="min0"><div class="previewtabs">${[['acceptance','運送引受書'],['dispatch','全天 運行指示書'],['daily','全天 日報']].map(([k,n])=>btn(n,'doc-mode',UI.doc===k?'primary':'','data-doc="'+k+'"')).join('')}</div><div id="previewInfo"></div><div class="previewstage" id="previewStage"><div class="muted" style="padding:35px">正在绘制预览…</div></div><p class="footnote">预览与ZIP中的PDF使用同一渲染器。纯离线输出采用高清图像PDF，适合打印；文字不是可选择的文本层。缺项显示 ，示例显示 SAMPLE。</p></div></div>`;}
function renderPreview(){let p=$('#previewStage');if(!p)return;try{let d=current(),doc=createDocument(UI.doc,d,UI.stage,UI.orderId);UI.preview=doc;p.innerHTML='';for(let c of doc.canvases)p.append(c);$('#previewInfo').innerHTML=`<div class="notice ${doc.canvases.length>1||doc.issues.length?'warn':''}">${doc.canvases.length} 页 · ${doc.badge||'日报预填稿'}${doc.issues.length?' · 待补：'+doc.issues.map(esc).join('、'):''}${doc.canvases.length>1?'。当前内容超过一页，未截断字段。':''}</div>`;}catch(e){UI.preview=null;p.innerHTML='<div class="notice error">'+esc(e.message)+'</div>';$('#previewInfo').innerHTML='';}}
const SET_TABS={company:'公司 / 营业所',vehicles:'车辆档案',drivers:'司机档案',customers:'客户 / 团体',aliases:'地点简称',backup:'备份与版本说明'};
function renderSettings(){let body='';if(UI.settings==='company'){body=`<div class="card pad"><h3>公司默认资料</h3><p class="form-note">以下地址、电话、营业区域沿用你最后提供的内容。营业区域仍按许可核对；紧急联系和管理者没有来源，留空待填。</p><div class="formgrid two">${[['name','運送引受者 / 公司名称'],['tel','代表电话'],['emergency','緊急時連絡先（不能自动以代表电话替代）'],['fax','FAX'],['area','営業区域'],['other','其他联系方式'],['dispatcher','默认调度担当']].map(([k,l])=>field('company','',k,l,S.company[k])).join('')}${field('company','','address','公司地址（两个地址按原信息保留）',S.company.address,{textarea:true,full:true})}</div></div>`+S.offices.map(o=>`<div class="card pad"><h3>${esc(o.name)}</h3><div class="formgrid two" style="margin-top:14px">${field('office',o.id,'name','营业所名称',o.name)}${field('office',o.id,'manager','運行管理者姓名',o.manager)}${field('office',o.id,'address','营业所地址',o.address)}${field('office',o.id,'garage','实际车库名称 / 地址（确认后填写）',o.garage)}</div><p class="form-note">营业所地址不自动当作车库。选择营业所后带出管理者和已登记车库；不伪造指示或签章。</p></div>`).join('')+`<div class="notice">设置修改用于新带入的任务；现有任务在“订单核对”中点击“带入最新基础资料”。历史版本不随设置变化。</div>${checkbox('state','','channelIsMethod','我们派单中的 WeChat/LINE/WhatsApp 标记明确表示客户申请渠道：今后导入时自动带入SNS方式。',S.channelIsMethod)}`;}
 else if(UI.settings==='vehicles'){body=`<div class="card pad"><div class="row between"><h3>车辆档案</h3>${btn('新增车辆','add-registry','soft','data-type="vehicles"','plus')}</div><p class="form-note">只有7012有完整车牌依据。其他仅登记尾号；不据尾号猜完整车牌、座位数或车型。</p><div class="tblwrap"><table class="tbl" style="min-width:650px"><thead><tr><th style="width:80px">尾号</th><th>完整登记车牌</th><th>车型</th><th style="width:95px">可载乘客数</th><th style="width:55px">操作</th></tr></thead><tbody>${S.vehicles.map(v=>`<tr><td>${field('vehicle',v.id,'tail','',v.tail,{bare:true})}</td><td>${field('vehicle',v.id,'plate','',v.plate,{bare:true})}</td><td>${field('vehicle',v.id,'model','',v.model,{select:MODEL,bare:true})}</td><td>${field('vehicle',v.id,'capacity','',v.capacity,{type:'number',bare:true})}</td><td>${btn('删','delete-registry','small danger','data-type="vehicles" data-id="'+v.id+'"')}</td></tr>`).join('')}</tbody></table></div></div>`;}
 else if(UI.settings==='drivers'){body=`<div class="card pad"><div class="row between"><h3>司机档案</h3>${btn('新增司机','add-registry','soft','data-type="drivers"','plus')}</div><p class="form-note">司机、车辆分别管理；抬头里的司机和车牌是当日分配关系。</p><div class="tblwrap"><table class="tbl" style="min-width:670px"><thead><tr><th>派单姓名</th><th>日文 / 文书姓名</th><th>联系电话</th><th style="width:90px">参考尾号</th><th style="width:55px">操作</th></tr></thead><tbody>${S.drivers.map(v=>`<tr>${['name','printName','phone','tail'].map(k=>'<td>'+field('driver',v.id,k,'',v[k],{bare:true})+'</td>').join('')}<td>${btn('删','delete-registry','small danger','data-type="drivers" data-id="'+v.id+'"')}</td></tr>`).join('')}</tbody></table></div></div>`;}
 else if(UI.settings==='customers'){body=`<div class="row between" style="margin-bottom:13px"><span class="small muted">每单选择客户带出资料；“个人”只是类型，真实姓名仍需填写。</span>${btn('新增客户预设','add-registry','soft','data-type="customers"','plus')}</div>`+S.customers.map(v=>`<div class="card pad"><div class="row between"><h3>${esc(v.short||'新客户')}</h3>${btn('删除预设','delete-registry','small danger','data-type="customers" data-id="'+v.id+'"')}</div><div class="formgrid" style="margin-top:12px">${field('customer',v.id,'short','内部简称',v.short)}${field('customer',v.id,'name','正式名称',v.name)}${field('customer',v.id,'phone','电话',v.phone)}${field('customer',v.id,'other','其他联系方式',v.other)}${field('customer',v.id,'group','默认团体名',v.group)}${field('customer',v.id,'type','客户类型',v.type,{select:{personal:'个人',agency:'旅行社',company:'公司 / 团体'}})}${field('customer',v.id,'method','默认申请方式',v.method,{select:METHODS})}${field('customer',v.id,'methodName','默认平台名称',v.methodName)}${field('customer',v.id,'notes','默认注意事项',v.notes)}</div></div>`).join('');}
 else if(UI.settings==='aliases'){body=`<div class="card pad"><div class="row between"><h3>自定义地点简称</h3>${btn('新增简称','add-registry','soft','data-type="aliases"','plus')}</div><p class="form-note">在原文出现左侧文字时带入右侧真实地点。未提供具体地点时保留“未確定”，不随机选酒店。规则只对新导入生效。</p><div class="tblwrap"><table class="tbl"><thead><tr><th style="width:35%">派单里的简称</th><th>正式地点显示名</th><th style="width:60px">操作</th></tr></thead><tbody>${S.aliases.map(v=>`<tr><td>${field('alias',v.id,'token','',v.token,{bare:true})}</td><td>${field('alias',v.id,'target','',v.target,{bare:true})}</td><td>${btn('删','delete-registry','small danger','data-type="aliases" data-id="'+v.id+'"')}</td></tr>`).join('')}</tbody></table></div><div class="notice">关西 / 関空 → 関西国際空港。微信 → WeChat。海狮 → ハイエース；阿尔法 → アルファード。省略的酒店、陌生简写和不明金额不会编造。</div></div>`;}
 else body=`<div class="card pad"><h3>离线数据与备份</h3><p>数据保存在当前浏览器的本机存储。更换文件路径、浏览器、电脑，或清理缓存，都可能无法看到原数据。</p><p>给司机的ZIP只含各订单引受书与两份全天PDF。数据备份JSON另行下载，包含客户、价格、派单和历史，不要发给司机或乘客。</p><div class="row wrap">${btn('下载完整数据备份','backup','primary','','download')}${btn('导入备份 / 旧版基础资料','restore','','','upload')}</div><p class="form-note">V0.3 / V0.4备份只迁入基础资料（公司、营业所、车辆、司机、客户、价格）；旧版派单与实绩需保留原软件，不宣称无损迁移。</p></div><div class="card pad"><h3>本版边界</h3><p>没有司机端、登录、消息发送、云端同步或后台AI。只做本机批量文书生成；EXE尚未封装。PNG形式的高清内容嵌入PDF，支持打印，不提供可选文字层。</p><p>当前为参考样式实现，不构成许可或法律合规认证；申请者、实际价格、点检及签章仍按真实业务核对。</p><p>通知依据：你提供的「都市型ハイヤー運送引受書、指示書.pdf」第4页别记1、第5页别记2。全天指示书是保留字段后的自定义汇总布局。日报按你提供的公司照片字段整理。</p></div>`;
 return `<div class="heading"><div><h1>基础资料</h1><p>重复信息只设一次。本单修改、价格快照与历史版本独立。</p></div>${btn('返回工作台','go-work','','','arrow')}</div><div class="settingsgrid"><nav class="settingsnav">${Object.entries(SET_TABS).map(([k,v])=>`<button class="${k===UI.settings?'active':''}" data-action="setting-tab" data-tab="${k}">${v}</button>`).join('')}</nav><div class="min0">${body}</div></div>`;
}
function renderPrices(){return `<div class="heading"><div><h1>价格与季节规则</h1><p>沿用你最后确认的合计参考价。每笔订单套用后保存快照，不随调价回写。</p></div>${btn('新增季节价格表','add-price','primary','','plus')}</div><div class="notice">市内＝大阪市内一地到另一地，点对点，载客行程在2小时以内。包车＝基础费用＋高速＋停车（实费未知时不默认为0）。跨区域适用分类由调度确认。</div>${S.prices.map(p=>`<div class="card pad"><div class="row between"><h3>${esc(p.name)}</h3>${p.id==='base'?'<span class="pill">基本默认</span>':btn('删除季节表','delete-price','small danger','data-id="'+p.id+'"')}</div><div class="formgrid" style="margin:15px 0">${field('price',p.id,'name','价格表名称',p.name)}${field('price',p.id,'from','生效日期（基本表可空）',p.from,{type:'date'})}${field('price',p.id,'to','结束日期（含当天）',p.to,{type:'date'})}</div><div class="tblwrap"><table class="tbl pricegrid"><thead><tr><th>合计参考类别</th><th>阿尔法 / 7座（日元）</th><th>海狮 / 10座（日元）</th></tr></thead><tbody>${Object.entries(CATS).filter(([k])=>k).map(([k,v])=>`<tr><td>${esc(v)}${k==='charter'?'<small class="block muted">此栏仅基础费用，另加高速及停车。</small>':''}</td><td>${field('price',p.id,'alpha.'+k,'',p.alpha[k],{type:'number',bare:true})}</td><td>${field('price',p.id,'hiace.'+k,'',p.hiace[k],{type:'number',bare:true})}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}<div class="footnote">多个季节表日期重叠时优先后建立的表；订单页面显示实际使用的表名，支持人工指定。价格表数值不是随机金额，也不自动替代真实约定价核对。</div>`;}
function renderHistory(){let hs=[...S.history].reverse();return `<div class="heading"><div><h1>计划与实绩版本</h1><p>已保存或已导出的版本留底。不通过实绩回写伪造事前指示。</p></div>${btn('完整数据备份','backup','primary','','download')}</div><div class="notice">导出ZIP时会自动保存对应数据快照。这里可以按保存当时的数据重新下载该司机的文件包，不混用最新修改。</div><div class="card">${hs.length?hs.map(h=>`<div class="historyline"><div><b>${esc(h.date)}　${esc(h.driver)}　${esc(h.tail)}</b> <span class="pill">${h.stage==='actual'?'実績補記':'予定版'} R${h.revision}</span><small>${esc(h.at)} · ${esc(h.label)}</small></div>${btn('导出此版本 ZIP','export-history','small','data-id="'+h.id+'"','download')}</div>`).join(''):'<div class="empty">还没有历史版本。保存计划或导出ZIP后会留底。</div>'}</div>`;}

async function restoreFile(file){try{if(file.size>40*1024*1024)throw Error('备份超过40MB，请先确认文件。');let x=JSON.parse(await file.text());if(x.schema===5){if(!Array.isArray(x.days)||!x.orders||!Array.isArray(x.prices)||!x.company||!Array.isArray(x.history))throw Error('备份结构不完整。');if(!confirm('恢复此V5–V13备份将替换当前本机数据。已下载当前数据备份了吗？'))return;S=x;S.build=APP_VERSION;S.activeDay=S.days.some(d=>d.id===S.activeDay)?S.activeDay:S.days[0]?.id||'';S.date=current()?.date||'';save();render();toast('完整数据已恢复；任务、实绩及历史版本均保留。');return;}
 if(x.company&&(x.schemaVersion||x.days||x.jobs)){if(!confirm('这是旧版备份。这里只迁入基础资料与价格，不迁入旧版任务/实绩；旧软件仍需保留。继续吗？'))return;
 Object.assign(S.company,{name:x.company.name||S.company.name,address:x.company.address||S.company.address,tel:x.company.tel||S.company.tel,fax:x.company.fax||S.company.fax,area:x.company.operatingArea||S.company.area,emergency:x.company.emergency||'',other:x.company.otherContact||'',dispatcher:x.company.dispatcher||''});if(Array.isArray(x.offices)&&x.offices.length)S.offices=x.offices.map(o=>({id:o.id||id('office'),name:o.name||'',address:o.address||'',garage:o.garage||'',manager:o.manager||''}));if(Array.isArray(x.vehicles)&&x.vehicles.length)S.vehicles=x.vehicles.map(v=>({id:v.id||id('vehicle'),tail:(v.plate?.match(/\d{1,4}$/)||[])[0]||v.tail||'',plate:v.plate||'',model:/アルファード|阿尔法|alpha/i.test(v.model||v.name)?'alpha':/ハイエース|海狮|hiace/i.test(v.model||v.name)?'hiace':'',capacity:v.capacity||'',note:v.notes||''}));if(Array.isArray(x.drivers)&&x.drivers.length)S.drivers=x.drivers.map(v=>({id:v.id||id('driver'),name:v.name||'',printName:'',tail:v.tail||'',phone:v.phone||'',officeId:'',note:v.notes||''}));if(Array.isArray(x.customers)&&x.customers.length)S.customers=x.customers.map(c=>({id:c.id||id('customer'),short:c.short||c.name||'',name:c.name||'',phone:c.phone||'',other:c.otherContact||'',type:c.isAgency==='是'?'agency':'personal',method:c.method||'',methodName:c.methodName||'',group:'',notes:c.notes||''}));if(Array.isArray(x.priceProfiles)&&x.priceProfiles.length)S.prices=x.priceProfiles.filter(p=>p.alpha&&p.hiace);S.channelIsMethod=!!x.channelIsApplication;save();UI.view='settings';render();toast('旧版基础资料已导入；旧任务/日报仍请在旧版保留。');return;}
 throw Error('未识别的备份格式。请选择本工具或V0.3/V0.4导出的JSON。');}catch(e){toast('导入失败：'+e.message,true);}}
function progressModal(title){UI.busy=true;modal(title,'<p id="progressText">正在准备PDF，请保持页面打开…</p><div class="progress"><div id="progressBar" style="width:2%"></div></div><p class="form-note">在本机绘制，不上传客户或行程资料。</p>');}

async function exportZip(all=false,history=null){let oldState=null;try{let days;if(history){oldState=S;S={...S,days:clone(history.linkedDays||[history.day]),orders:clone(history.orders)};days=[S.days.find(d=>d.id===history.dayId)||S.days[0]];}else days=all?visibleDays():[current()];if(!days.length||!days[0])throw Error('还没有司机任务。');let stage=history?.stage||UI.stage;
 progressModal('生成 '+(all?'当日全员':'司机')+' PDF 与 ZIP');await new Promise(r=>setTimeout(r,50));let packet=await buildPacket(days,{stage,strict:history?false:UI.strict,allowContinuation:history?true:!!UI.allowContinuation,progress:progressUpdate});let date=days[0].date,filename=safeName(date+'_'+(all?'大寅全员':days[0].driver+'_'+days[0].tail)+'_'+(stage==='actual'?'実績補記版':'予定版')+(days.some(d=>d.sample)?'_SAMPLE':''))+'_'+now().slice(11).replaceAll(':','')+'.zip';
 downloadBlob(packet.data,filename,'application/zip');if(!history){for(let d of days)snapshot(d,stage,'ZIP导出留底');}UI.busy=false;closeModal();toast('已生成 '+packet.files.length+' 份PDF，打包为一个ZIP。'+(packet.multiPage.length?'续页：'+packet.multiPage.join('、'):''));return packet;
 }catch(e){UI.busy=false;closeModal();modal('本次没有生成不完整的压缩包','<div class="notice error">'+esc(e.message)+'</div><p class="small muted">可以在右侧实时预览核对单页容量。测试缺项可取消“正式文书导出”，文件会保留/SAMPLE标识。</p>',btn('知道了','close','primary'));}finally{if(oldState)S=oldState;UI.busy=false;}}
function showLink(t){let d=taskDay(t.id),o=getOrder(t),other=S.days.filter(x=>x.date===d.date).flatMap(dd=>dd.tasks.filter(tt=>tt.orderId!==o.id).map(tt=>({dd,tt})));modal('关联为同一多车订单',`<p class="small muted">当前：${esc(d.driver)} / ${esc(t.raw)}。请选择另一辆车的同一客户订单。合并后以当前申请者资料为主，金额仍按各车分别保存。</p><div class="field"><label>另一条已分配任务</label><select id="linkTarget">${other.map(({dd,tt})=>'<option value="'+tt.id+'">'+esc(dd.driver+' '+dd.tail+' / '+tt.raw)+'</option>').join('')}</select></div><div class="notice warn">只在核对确为同一个客户订单后关联。时间、申请者或行程不同的订单不能为了简化文件而合并。</div>`,btn('取消','close')+btn('确认是同一订单','do-link','primary','data-id="'+t.id+'"'));}
function quickAddTask(d){modal('给当前司机增加一笔订单',`<p class="small muted">${esc(d.driver)} / ${d.date} / ${esc(d.tail)}</p><textarea id="newTaskRaw" style="min-height:100px" placeholder="18:00 关西接机大阪 微信"></textarea>`,btn('取消','close')+btn('加入订单','do-add-task','primary'));}
function showAddNode(d){modal('增加地点节点',`<div class="formgrid two"><div class="field"><label>归属订单</label><select id="nodeTask">${d.tasks.map((t,i)=>'<option value="'+t.id+'">第'+(i+1)+'单 '+esc(t.rawTime)+' '+esc(getOrder(t).number)+'</option>').join('')}</select></div><div class="field"><label>节点类型</label><select id="nodeRole"><option value="via">立寄り / 中途停靠</option><option value="wait">待機</option><option value="rest">休憩（按实际认定）</option></select></div><div class="field full"><label>具体地点</label><input id="nodePlace" placeholder="输入真实地点，不随机生成"></div></div><p class="form-note">先插入到该单下车点之前，可在地点表调整顺序。实际已发生的节点不允许删除。</p>`,btn('取消','close')+btn('增加','do-add-node','primary'));}
function getBinding(el){let {scope:s,id:who,key}=el.dataset,obj,d=null;if(s==='day'){obj=S.days.find(x=>x.id===who);d=obj;}else if(s==='node'){d=S.days.find(x=>x.nodes.some(n=>n.id===who));obj=d?.nodes.find(n=>n.id===who);}else if(s==='task'){d=taskDay(who);obj=d?.tasks.find(t=>t.id===who);}else if(s==='order')obj=S.orders[who];else if(s==='company')obj=S.company;else if(s==='state')obj=S;else if(s==='check'){d=S.days.find(x=>x.id===who);obj=d?.checks;}else{let plural={office:'offices',vehicle:'vehicles',driver:'drivers',customer:'customers',alias:'aliases',price:'prices'}[s];obj=S[plural]?.find(x=>x.id===who);}if(!obj)throw Error('无法找到当前字段的数据。');return {obj,d,scope:s,key};}
function onBoundChange(el){let {obj,d,scope,key}=getBinding(el),val=el.type==='checkbox'?el.checked:el.value;if(el.type==='number'&&val!==''&&(!Number.isFinite(Number(val))||Number(val)<0)){toast('请输入有效的非负数字。',true);el.focus();return;}let parts=key.split('.');if(parts.length===2)obj[parts[0]][parts[1]]=val;else obj[key]=val;
 if(scope==='task'&&key==='timeMeaning')setTimeMeaning(d,obj,val);
 if(scope==='day'&&key==='officeId'){let office=currentOffice(d);if(office){d.officeName=office.name;d.manager=office.manager;if(office.garage){d.nodes[0].place=office.garage;d.nodes.at(-1).place=office.garage;}}}
 if(scope==='order'&&key==='customerId'){let c=S.customers.find(c=>c.id===val);if(c){Object.assign(obj,{applicant:c.name||'',phone:c.phone||'',other:c.other||'',applicantType:c.type||'personal',method:c.method||'',methodName:c.methodName||'',group:c.group||''});}}
 if(scope==='task'&&['fare','fees','feeDetail','toll','parking','category'].includes(key))obj.priceConfirmed=false;
 if(d){d.revision++;if(key!=='actualReviewed')d.actualReviewed=false;if(scope==='node'&&(key.startsWith('plan')||key==='place'))d.planReviewed=false;}
 if(scope==='order')for(let {d:dd}of assignments(obj.id)){dd.revision++;dd.planReviewed=false;dd.actualReviewed=false;}
 save();if(UI.tab==='actual')updateActual();if(el.dataset.render)setTimeout(render,0);
}
async function action(name,b){let d=current(),who=b?.dataset.id;switch(name){
 case 'close':closeModal();break;
 case 'go-work':UI.view='work';render();break;
 case 'setting-tab':UI.settings=b.dataset.tab;render();break;
 case 'select-day':S.activeDay=who;save();UI.orderId='';render();break;
 case 'tab':UI.tab=b.dataset.tab;render();break;
 case 'import':showImport();break;
 case 'paste-sample':$('#importRaw').value=SAMPLE_SOURCE;$('#importYear').value='2026';$('#importSample').checked=true;break;
 case 'parse-import':{let raw=$('#importRaw').value,year=$('#importYear').value,sample=$('#importSample').checked,batch=parseBatch(raw,year,sample);S.importYear=year;let res=installBatch(batch,raw);closeModal();UI.view='work';UI.tab='orders';render();toast('已建立 '+res.added+' 份司机工作表；'+res.skipped+' 份重复抬头未覆盖。'+(batch.notes.length?'有未识别内容已保留在备注。':''));break;}
 case 'sample':{let batch=parseBatch(SAMPLE_SOURCE,'2026',true),r=installBatch(batch,SAMPLE_SOURCE);let lu=S.days.find(x=>x.driver==='吕云龙'&&x.sample);if(lu){S.activeDay=lu.id;S.date=lu.date;}UI.view='work';UI.tab='orders';save();render();toast('载入示例：11名司机、32条任务、31个独立订单。原文缺项保留待补。');break;}
 case 'clear-samples':if(confirm('仅清除当前所有示例工作表及示例历史，基础资料和真实任务不变。继续？')){let ids=new Set(S.days.filter(x=>x.sample).map(x=>x.id));S.days=S.days.filter(x=>!x.sample);S.history=S.history.filter(x=>!ids.has(x.dayId));orphanCleanup();S.activeDay=S.days[0]?.id||'';S.date=current()?.date||'';save();render();}break;
 case 'backup':backup();break;
 case 'restore':fileInput('.json',restoreFile);break;
 case 'refresh-day':if(confirm('将当前公司/车辆/所选营业所预设带入本日？会覆盖本日相应基本信息，不覆盖订单或实绩。')){refreshDayMasters(d);render();}break;
 case 'apply-price':{let dd=taskDay(who),t=taskOf(who);if(t.price&&!confirm('重新使用当前价格表会替换本单参考价，并清空旧运賃/料金拆分。历史版本不变。继续？'))break;applyPrice(dd,t);touch(dd);render();break;}
 case 'confirm-method':{let o=S.orders[who];if(o.methodCandidate==='携程'){toast('请选择实际申请方式：配車アプリ 或 ウェブサイト；平台名填携程。',true);o.methodName='携程';save();render();break;}o.method='SNS';o.methodName=o.methodCandidate;for(let {d:dd}of assignments(who))touch(dd);render();break;}
 case 'link-task':showLink(taskOf(who));break;
 case 'do-link':{let t=taskOf(who),u=taskOf($('#linkTarget').value);if(!u)throw Error('请选择另一条任务');let old=getOrder(u),base=getOrder(t),list=assignments(old.id);if(!confirm('确认将两组任务归为同一客户订单？申请者资料以当前订单为主，各车费用保留。'))break;for(let {d:dd,t:tt}of list){tt.orderId=base.id;touch(dd);}delete S.orders[old.id];base.multi=assignments(base.id).length;base.multiConfirmed=true;base.multiNote='调度手动确认关联于 '+now();save();closeModal();render();break;}
 case 'unlink-task':{let t=taskOf(who),o=getOrder(t);if(assignments(o.id).length<2){toast('当前没有其他已关联车辆。');break;}if(!confirm('将当前车拆成独立订单？'))break;let nn=clone(o);nn.id=id('order');nn.number='A-'+d.date.replaceAll('-','')+'-'+id().slice(-6).toUpperCase();nn.multi=1;nn.multiConfirmed=false;nn.multiNote='调度解除关联';S.orders[nn.id]=nn;t.orderId=nn.id;o.multi=assignments(o.id).length;o.multiConfirmed=o.multi>1;touch(d);render();break;}
 case 'single-task':{let t=taskOf(who),o=getOrder(t);if(assignments(o.id).length>1)throw Error('请先解除其他车辆关联。');if(confirm('原文有多车需求。确认这条记录在系统中只对应当前车，其他车辆另行处理？')){o.multi=1;o.multiNote='调度确认本记录仅当前车；原文多车需求仍保留。';touch(d);render();}break;}
 case 'add-task':quickAddTask(d);break;
 case 'do-add-task':{let raw=$('#newTaskRaw').value.trim();if(!clock(raw))throw Error('请输入含有效时间的订单');let last=d.nodes.pop(),o=parseTask(raw,d);S.orders[o.id]=o;d.nodes.push(last);touch(d);closeModal();render();break;}
 case 'delete-task':{let t=taskOf(who),dd=taskDay(who),ns=nodesFor(dd,t);if(ns.some(n=>n.arr||n.dep||n.odo!==''))throw Error('已有实际记录的任务不能直接删除。请保留记录并写明实际取消/变更。');if(!confirm('删除这笔未执行任务与对应地点？将先保存计划副本。'))break;snapshot(dd,'plan','删除未执行任务前留底');dd.tasks=dd.tasks.filter(t=>t.id!==who);dd.nodes=dd.nodes.filter(n=>n.taskId!==who);orphanCleanup();touch(dd);render();break;}
 case 'add-node':showAddNode(d);break;
 case 'do-add-node':{let tid=$('#nodeTask').value,place=$('#nodePlace').value.trim(),role=$('#nodeRole').value;if(!place)throw Error('请填写地点');let t=d.tasks.find(t=>t.id===tid),n=node(place,role,tid),ix=d.nodes.findIndex(n=>n.id===t.dropId);n.load=role==='via'?'loaded':'';d.nodes.splice(ix,0,n);touch(d);closeModal();render();break;}
 case 'node-up':case 'node-down':{let i=d.nodes.findIndex(n=>n.id===who),j=i+(name==='node-up'?-1:1);if(j<=0||j>=d.nodes.length-1)throw Error('不能移动到出库之前或归库之后。');if([d.nodes[i],d.nodes[j]].some(n=>n.arr||n.dep||n.odo!==''))throw Error('已填写实绩的节点不调整顺序。');[d.nodes[i],d.nodes[j]]=[d.nodes[j],d.nodes[i]];d.planReviewed=false;touch(d);render();break;}
 case 'delete-node':{let n=d.nodes.find(n=>n.id===who);if(n.arr||n.dep||n.odo!=='')throw Error('已发生的节点不能直接删除。请写变更备注。');if(confirm('删除这个未执行的中途节点？')){d.nodes=d.nodes.filter(n=>n.id!==who);touch(d);render();}break;}

renderWork=function(){let days=visibleDays(),d=current();if(d&&!days.some(x=>x.id===d.id)){S.activeDay=days[0]?.id||'';d=current();}if(!days.length||!d)return `<div class="v6-toolbar"><b>离线文书工作台</b><span class="pill">V0.13 · 左填右看</span></div><div class="v6-empty"><div>${icon('doc')}<h2>导入派单，边填边看。</h2><p>选择司机后，左边核对内容，右边同步预览三种文书。</p><div class="row wrap" style="justify-content:center">${btn('批量导入派单','import','primary','','upload')}${btn('载入11名司机示例','sample','soft')}</div></div></div>`;if(!['orders','plan','actual'].includes(UI.tab))UI.tab='orders';v6EnsureOrder(d);return v6Toolbar(d)+`<div class="v6-studio" id="v6Studio" style="--v6-input:${UI.splitPercent}%"><section class="v6-editor" aria-label="左侧入力项目">${v6EditorHeader(d)}<div id="v6EditorScroll" class="v6-editor-scroll">${UI.tab==='orders'?renderOrders(d):UI.tab==='plan'?renderPlan(d):renderActual(d)}</div></section><div class="v6-divider" id="v6Divider" role="separator" tabindex="0" aria-label="拖动调整左右宽度，方向键也可调整" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="65" aria-valuenow="49" title="拖动调整左右宽度 / 双击恢复默认"></div>${v6PreviewPane(d)}</div>`;};

/* Keep clearly written, out-of-catalogue hotel names / street addresses.
 * Only rebuild explicitly separated routes; legacy natural-language parsing is
 * still used when no precise endpoint is supplied. */
parseRoute=function(raw){
 const original=V8.parseRoute(raw);
 let body=String(raw||'').normalize('NFKC').replace(/^[\s\d\uFE0F\u20E3]+(?=\d{1,2}:)/,'')
  .replace(/^.*?\d{1,2}:\d{2}\s*(?:am|pm)?\s*[,，*]?\s*/i,'')
  .split(/\s*(?:WhatsApp|Whatsup|WeChat|微信|\bLINE\b|日元结算|代收|包车|備水|备水|携程|指定时间)/i)[0].trim();
 const parts=body.replace(/(\d)[-－](?=\d)/g,'$1§').split(/\s*(?:→|⇒|[-－]|送机|接机)\s*/).map(x=>x.replaceAll('§','-').replace(/^举牌/,'').trim()).filter(Boolean);
 const precise=x=>!hContext({role:'pickup',place:x})&&(/ホテル|酒店|飯店|饭店|旅館|宾馆|\bhotel\b/i.test(x)||/(?:大阪|京都).*(?:区|區|町).*(?:丁目|番|号|\d)/.test(x));
 if(parts.length<2||!parts.some(precise))return original;
 const out=[];
 for(const part of parts){if(precise(part)){out.push(hExact(part)?.name||part);continue;}
  const ps=V8.parseRoute(part).filter(x=>!['乗車場所未確定','降車場所未確定','空港・乗車場所未確定'].includes(x));
  if(!ps.length)return original;out.push(...ps);
 }
 return out.length>=2?out:original;
};

/* Operations: use linked nodes, not a second, disconnected set of times. */
function v9Bounds(d,t,stage='plan'){
 const ns=nodesFor(d,t),p=ns[0],q=ns.at(-1);
 const result={mode:t.scope||'auto',start:{node:null,event:'dep'},end:{node:null,event:'arr'},source:'',issues:[]};
 if(result.mode==='manual'){
  result.start={place:t.scopeStart||'',time:v9ValidTime(t.scopeStartTime),day:Number(t.scopeStartDay)||0};
  result.end={place:t.scopeEnd||'',time:v9ValidTime(t.scopeEndTime),day:Number(t.scopeEndDay)||0};result.source='本单独立录入';return result;
 }
 if(result.mode==='day'){result.start.node=d.nodes[0];result.end.node=d.nodes.at(-1);result.source='已选择全天出库至归库';}
 else if(result.mode==='custom'){
  result.start.node=d.nodes.find(n=>n.id===t.scopeStartNode);result.end.node=d.nodes.find(n=>n.id===t.scopeEndNode);
  result.start.event=t.scopeStartEvent||'dep';result.end.event=t.scopeEndEvent||'arr';result.source='自选节点，时间随节点同步';
  if(!result.start.node||!result.end.node)result.issues.push('自选运行起止节点已缺失，请重新选择');
 }else{
  result.mode='auto';const pi=d.nodes.indexOf(p),qi=d.nodes.indexOf(q),idx=d.tasks.indexOf(t);
  result.start.node=pi>0?d.nodes[pi-1]:p;
  result.end.node=idx===d.tasks.length-1?d.nodes.at(-1):q;
  if(result.start.node?.role==='drop'&&!ntime(result.start.node,'dep',stage)&&ntime(result.start.node,'arr',stage))result.start.event='arr';
  result.source=idx===0?(d.tasks.length===1?'自动关联：出库 → 本单乘降 → 归库':'自动关联：出库 → 本单送达'):(idx===d.tasks.length-1?'自动关联：上一单结束点 → 本单乘降 → 归库':'自动关联：上一单结束点 → 本单送达');
 }
 for(const side of ['start','end']){const s=result[side];s.place=s.node?nplace(s.node,stage):'';s.time=v9ValidTime(ntime(s.node,s.event,stage));s.day=nday(s.node,s.event,stage);}

}
